        .node-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
        .node-card.selected{border-color:var(--accent-blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}

        .node-url{font-weight:600;color:var(--accent-blue);font-size:.82rem;word-break:break-all;flex:1;min-width:0}
        .node-latency{font-weight:700;padding:4px 12px;border-radius:20px;font-size:.8rem;white-space:nowrap;flex-shrink:0}

        .latency-high{background:#fef2f2;color:var(--accent-rose)}
        .select-node-btn{width:100%;padding:10px;border:none;border-radius:var(--radius-sm);background:var(--bg-subtle);color:var(--text-secondary);font-size:.82rem;font-weight:600;cursor:pointer;transition:var(--transition-fast);font-family:inherit}

<body>
<div class="atmosphere"></div>

<div class="page">

        <a href="/" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit">

        </div>

    <div class="hero-section">
        <div class="hero-icon-wrap"><i class="fa-brands fa-github"></i></div>
        <h1>GitHub文件<span class="gradient-text">镜像下载</span>工具</h1>
        <p class="hero-desc">支持 Git Clone、Releases、Archive、Gist、Raw 文件加速访问，输入 URL 选择节点，一键生成加速链接</p>
    </div>

    <div class="card">
        <div class="card-head"><i class="fas fa-link"></i> 输入 GitHub 文件链接</div>
        <div class="card-body">
            <div class="input-row">
                <input type="text" id="githubUrl" class="url-input" placeholder="输入GitHub文件URL（例如：https://github.com/user/repo/file）">
                <button id="generateBtn" class="btn btn-primary"><i class="fas fa-bolt"></i> 开始下载</button>
            </div>
            <div class="msg error" id="errorMessage"></div>
            <div class="msg success" id="successMessage"></div>
        </div>
    </div>

    <div class="card hidden" id="resultContainer">
        <div class="card-head"><i class="fas fa-check-circle"></i> 生成的镜像下载链接</div>
        <div class="card-body">
            <div class="result-url" id="mirrorUrl">等待生成链接...</div>
            <div class="btn-group">
                <button class="btn btn-primary" id="copyBtn"><i class="fas fa-copy"></i> 复制链接</button>
                <button class="btn btn-secondary" id="downloadBtn"><i class="fas fa-download"></i> 打开下载</button>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-head"><i class="fas fa-server"></i> 镜像节点列表</div>
        <div class="card-body">
            <div class="nodes-header">
                <div class="card-head" style="border:none;padding:0"><i class="fas fa-globe"></i> 可用节点</div>
                <div class="nodes-stats">总数 <span id="totalNodes">0</span> &middot; 可用 <span id="availableNodes">0</span></div>
            </div>
            <div class="loading" id="nodesLoading"><div class="spinner"></div><p>正在加载镜像节点...</p></div>
            <div class="nodes-grid" id="nodesGrid"></div>
        </div>
    </div>

    <footer class="page-foot">&copy; <span id="nowYear"></span> 划水鸭 &mdash; <a href="/">划水鸭</a> 出品</footer>
</div>

    <script src="static/js/super-git.js"></script>
    <script>
        document.getElementById("nowYear").innerHTML = new Date().getFullYear();
        const githubUrlInput = document.getElementById('githubUrl');
        const generateBtn = document.getElementById('generateBtn');
        const resultContainer = document.getElementById('resultContainer');
        const mirrorUrlElement = document.getElementById('mirrorUrl');
        const copyBtn = document.getElementById('copyBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const nodesGrid = document.getElementById('nodesGrid');
        const totalNodesElement = document.getElementById('totalNodes');
        const availableNodesElement = document.getElementById('availableNodes');
        const nodesLoading = document.getElementById('nodesLoading');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const refreshNodesBtn = document.getElementById('refreshNodes');

        let mirrorNodes = [];
        let selectedNode = null;

        document.addEventListener('DOMContentLoaded', () => {
            generateBtn.addEventListener('click', generateMirrorUrl);
            copyBtn.addEventListener('click', copyMirrorUrl);
            downloadBtn.addEventListener('click', openDownloadLink);
            refreshNodesBtn.addEventListener('click', fetchMirrorNodes);
            fetchMirrorNodes();
        });

        async function fetchMirrorNodes() {
            nodesLoading.style.display = 'block';
            errorMessage.style.display = 'none';
            nodesGrid.innerHTML = '';

            // 并行发起远程请求和本地节点测速
            const remotePromise = fetch('https://api.akams.cn/github').then(async function(res) {
                if (!res.ok) throw new Error('HTTP错误! 状态: ' + res.status);
                var data = await res.json();
                if (data.code !== 200) throw new Error(data.msg || '获取镜像节点失败');
                return data.data;
            });

            var localPromise = Promise.resolve(null);
            if (typeof speedTester !== 'undefined' && speedTester.DEFAULT_NODES) {
                localPromise = speedTester.testNodesSpeed(speedTester.DEFAULT_NODES).then(function(results) {
                    var valid = results.filter(function(r) { return r.success; });
                    return valid.length > 0 ? valid.map(function(r) { return { url: r.url, latency: r.latencyMs }; }) : null;
                });
            }

            try {
                mirrorNodes = await remotePromise;
                if (mirrorNodes && mirrorNodes.length > 0) {
                    mirrorNodes.sort(function(a, b) { return a.latency - b.latency; });
                    renderNodesGrid();
                    selectBestNode();
                    updateNodesStats();
                    return;
                }
                throw new Error('远程节点列表为空');
            } catch (remoteError) {
                console.warn('远程节点获取失败，使用本地节点:', remoteError);
                try {
                    var fallbackNodes = await localPromise;
                    if (fallbackNodes && fallbackNodes.length > 0) {
                        mirrorNodes = fallbackNodes;
                        renderNodesGrid();
                        selectBestNode();
                        updateNodesStats();
                        return;
                    }
                } catch (fallbackError) {
                    console.error('本地节点也失败:', fallbackError);
                }
                showError('获取镜像节点失败: ' + remoteError.message);
            } finally { nodesLoading.style.display = 'none'; }
        }

        function renderNodesGrid() {
            nodesGrid.innerHTML = '';
            mirrorNodes.forEach(node => {
                const isSelected = selectedNode && selectedNode.url === node.url;
                let latencyClass = '';
                if (node.latency < 500) { latencyClass = 'latency-low'; }
                else if (node.latency >= 500 && node.latency < 1000) { latencyClass = 'latency-medium'; }
                else { latencyClass = 'latency-high'; }
                const card = document.createElement('div');
                card.className = `node-card ${isSelected ? 'selected' : ''}`;
                card.innerHTML = `
                    <div class="node-card-header">
                        <div class="node-url">${node.url}</div>
                        <div class="node-latency ${latencyClass}">${node.latency} ms</div>
                    </div>
                    <button class="select-node-btn" data-url="${node.url}">
                        <span>${isSelected ? '<i class="fas fa-check"></i> 已选择' : '选择此节点'}</span>
                    </button>
                `;
                nodesGrid.appendChild(card);
            });
            document.querySelectorAll('.select-node-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const nodeUrl = btn.getAttribute('data-url');
                    selectNode(nodeUrl);
                });
            });
        }

        function selectBestNode() {
            if (mirrorNodes.length === 0) return;
            const validNodes = mirrorNodes.filter(node => node.latency > 0);
            if (validNodes.length === 0) return;
            const bestNode = [...validNodes].sort((a, b) => a.latency - b.latency)[0];
            selectNode(bestNode.url);
        }

        function selectNode(nodeUrl) {
            selectedNode = mirrorNodes.find(node => node.url === nodeUrl);
            renderNodesGrid();
            if (githubUrlInput.value.trim()) { generateMirrorUrl(); }
        }

        function updateNodesStats() {
            totalNodesElement.textContent = mirrorNodes.length;
            const availableCount = mirrorNodes.filter(node => node.latency > 0 && node.latency < 1500).length;
            availableNodesElement.textContent = availableCount;
        }

        function generateMirrorUrl() {
            let githubUrl = githubUrlInput.value.trim();
            if (!githubUrl) { showError('请输入GitHub文件URL'); return; }
            githubUrl = modifyGithubUrl(githubUrl)
            if (!isValidGitHubUrl(githubUrl)) { showError('请输入有效的GitHub文件URL'); return; }
            if (!selectedNode) { showError('请先选择镜像节点'); return; }
            const mirrorUrl = selectedNode.url.replace(/\/+$/, '') + '/' + githubUrl;
            mirrorUrlElement.textContent = mirrorUrl;
            resultContainer.classList.remove('hidden');
            resultContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function isValidGitHubUrl(url) { const githubPattern = /^https?:\/\/github\.com\/.+/i; return githubPattern.test(url); }
        function modifyGithubUrl(originalUrl) {
            try { const url = new URL(originalUrl); if (url.hostname === 'bgithub.xyz') { url.hostname = 'github.com'; return url.toString(); } } catch (e) {} return originalUrl;
        }
        function copyMirrorUrl() { copyTextToClipboard(mirrorUrlElement.textContent); showSuccess('链接已复制到剪贴板！'); }
        function copyTextToClipboard(text) {
            const textArea = document.createElement('textarea'); textArea.value = text; document.body.appendChild(textArea); textArea.select();
            try { document.execCommand('copy'); } catch (err) { console.error('复制失败:', err); }
            document.body.removeChild(textArea);
        }
        function openDownloadLink() { window.open(mirrorUrlElement.textContent, '_blank'); }
        function showError(message) { errorMessage.textContent = message; errorMessage.style.display = 'block'; successMessage.style.display = 'none'; setTimeout(() => { errorMessage.style.display = 'none'; }, 3000); }
        function showSuccess(message) { successMessage.textContent = message; successMessage.style.display = 'block'; errorMessage.style.display = 'none'; setTimeout(() => { successMessage.style.display = 'none'; }, 3000); }
    </script>
    <script src="static/js/cache-updater.js"></script>
